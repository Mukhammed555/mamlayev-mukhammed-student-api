# =====================================================================
#  Docker Compose - mamlayev-mukhammed-student-api
#  Author: Mukhammed Mamlayev
#  Usage : cp .env.example .env   (set your own password)
#          docker compose up -d --build
# =====================================================================
name: mamlayev-mukhammed-student-api

services:
  db:
    image: postgres:16-alpine
    container_name: mamlayev-mukhammed-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-studentdb}
      POSTGRES_USER: ${POSTGRES_USER:-student}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - mamlayev-mukhammed-pgdata:/var/lib/postgresql/data
    networks:
      - mamlayev-mukhammed-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mamlayev-mukhammed-student-api:${IMAGE_TAG:-v1.0-mamlayev-mukhammed}
    container_name: mamlayev-mukhammed-student-api
    restart: unless-stopped
    environment:
      # "db" is the Compose service name. Docker's internal DNS resolves it to
      # the PostgreSQL container. "localhost" would point to the app container itself.
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-studentdb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-student}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      APP_STUDENT_NAME: "Mukhammed Mamlayev"
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mamlayev-mukhammed-net

volumes:
  mamlayev-mukhammed-pgdata:
    name: mamlayev-mukhammed-pgdata

networks:
  mamlayev-mukhammed-net:
    name: mamlayev-mukhammed-net
    driver: bridge
