# Test configuration: in-memory H2 database, so tests (and the Jenkins
# "Test" stage) do not need a running PostgreSQL server.
spring.application.name=mamlayev-mukhammed-student-api
spring.datasource.url=jdbc:h2:mem:studentdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
app.student.name=Mukhammed Mamlayev
