# mamlayev-mukhammed-student-api - author: Mukhammed Mamlayev
spring.application.name=mamlayev-mukhammed-student-api
server.port=${SERVER_PORT:8080}

# Database connection. Real values come from environment variables
# (docker-compose.yml / .env). Inside Docker the host is the service name "db".
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/studentdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:student}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Personal settings
app.student.name=${APP_STUDENT_NAME:Mukhammed Mamlayev}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
